<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F7EF8A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.4"/>
  <!-- Diamond pattern -->
  <pattern id="diamonds" patternUnits="userSpaceOnUse" width="40" height="40">
    <path d="M20 0L40 20L20 40L0 20Z" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.08"/>
  </pattern>
  <rect x="20" y="20" width="472" height="472" rx="88" fill="url(#diamonds)"/>
  <!-- TP Text -->
  <text x="256" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="200" fill="url(#gold)">TP</text>
  <!-- Spade suit small -->
  <text x="256" y="380" text-anchor="middle" font-size="60" fill="#D4AF37" opacity="0.6">♠</text>
</svg>
