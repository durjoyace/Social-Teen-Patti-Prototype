name: Production checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teenpatti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teenpatti_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teenpatti_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teenpatti_test
      JWT_SECRET: ci-jwt-secret-with-more-than-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-more-than-thirty-two-characters
      REFERRAL_HASH_SECRET: ci-referral-secret-with-more-than-thirty-two-characters
      PUBLIC_APP_URL: https://social-teen-patti.vercel.app
      CORS_ORIGIN: https://social-teen-patti.vercel.app
      PURCHASES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm --filter teen-patti-server exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Validate release configuration
        env:
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.social-teen-patti.example/api
          EXPO_PUBLIC_SOCKET_URL: https://api.social-teen-patti.example
          EXPO_PUBLIC_APP_URL: https://social-teen-patti.vercel.app
        run: |
          node --check server/scripts/smoke.mjs
          node -e "JSON.parse(require('fs').readFileSync('packages/mobile/eas.json'))"
          pnpm --filter @teen-patti/mobile exec expo config --type public >/dev/null
      - name: Build production server container
        run: docker build --tag teen-patti-server:ci server
      - name: Export mobile bundle
        run: |
          pnpm --filter @teen-patti/mobile exec expo install --check
          pnpm --filter @teen-patti/mobile exec expo export --platform android --output-dir dist-ci
      - name: Audit web and server beta runtimes
        run: pnpm audit:web-beta
      - name: Mobile store dependency gate (release held)
        continue-on-error: true
        run: pnpm audit:prod
