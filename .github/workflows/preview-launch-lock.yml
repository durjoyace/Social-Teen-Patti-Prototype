name: Preview launch lockfile refresh

on:
  push:
    branches: [codex/launch-readiness-hardening]
    paths:
      - package.json
      - packages/brace-expansion-compat/package.json
  pull_request:
    paths:
      - package.json
      - packages/brace-expansion-compat/package.json

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Print reviewed lockfile patch
        run: git diff -- pnpm-lock.yaml
